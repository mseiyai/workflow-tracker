services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow_tracker
      POSTGRES_USER: workflow_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: workflow-tracker-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://workflow_tracker:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/workflow_tracker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5

  seed:
    image: workflow-tracker-api
    command:
      - python
      - -m
      - backend.seed
    environment:
      DATABASE_URL: postgresql+psycopg://workflow_tracker:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/workflow_tracker
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
